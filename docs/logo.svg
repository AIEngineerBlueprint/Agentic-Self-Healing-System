<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 150" width="520" height="150"
     font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>ASHS — Agentic Self-Healing System</title>
  <defs>
    <linearGradient id="logoBrand" x1="10" y1="14" x2="105" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f81f7"/><stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
  </defs>

  <!-- shield -->
  <g transform="translate(14, 18) scale(2.35)">
    <path d="M24 3.5 41 10.2v14.4c0 8.9-7.3 15.6-17 20.1-9.7-4.5-17-11.2-17-20.1V10.2z"
          fill="url(#logoBrand)" fill-opacity=".14" stroke="url(#logoBrand)"
          stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M14.2 32a10.4 10.4 0 0 0 19.6 0" stroke="#3fb950" stroke-width="2.3"
          stroke-linecap="round" fill="none"/>
    <path d="M14.9 27.2 14 32.4l5.2 1" stroke="#3fb950" stroke-width="2.3"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="16" y="15.5" width="16" height="12.5" rx="4.5" fill="#ffffff"
          stroke="url(#logoBrand)" stroke-width="1.8"/>
    <path d="M24 15.5v-2.8" stroke="url(#logoBrand)" stroke-width="1.7" stroke-linecap="round"/>
    <circle cx="24" cy="11.4" r="1.7" fill="#3fb950"/>
    <circle cx="20.7" cy="21.7" r="1.9" fill="#2f81f7"/>
    <circle cx="27.3" cy="21.7" r="1.9" fill="#2f81f7"/>
  </g>

  <!-- wordmark -->
  <text x="140" y="62" font-size="46" font-weight="700" letter-spacing="-1" fill="#0f172a">ASHS</text>
  <text x="140" y="88" font-size="17" fill="#334155">Agentic Self-Healing System</text>
  <line x1="141" y1="102" x2="470" y2="102" stroke="url(#logoBrand)" stroke-width="2"/>
  <text x="140" y="122" font-size="12.5" letter-spacing="3.2" fill="#64748b">DETECT · DIAGNOSE · REPAIR · RECOVER</text>
</svg>
