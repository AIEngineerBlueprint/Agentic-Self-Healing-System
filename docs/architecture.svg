<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760"
     font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>ASHS — Agentic Self-Healing System architecture</title>

  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f81f7"/><stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowTel" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a855f7"/>
    </marker>
    <marker id="arrowAct" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/>
    </marker>
  </defs>

  <rect width="1240" height="760" fill="#ffffff"/>

  <!-- ============================================ title -->
  <g>
    <path d="M28 22 L44 28.3v13.5c0 8.4-6.9 14.7-16 18.9-9.1-4.2-16-10.5-16-18.9V28.3z"
          fill="url(#brand)" fill-opacity=".15" stroke="url(#brand)" stroke-width="2" stroke-linejoin="round"/>
    <path d="M18.5 49a9.8 9.8 0 0 0 19 0" stroke="#3fb950" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <rect x="20.5" y="33" width="15" height="11.5" rx="4" fill="#ffffff" stroke="url(#brand)" stroke-width="1.6"/>
    <circle cx="24.6" cy="38.6" r="1.7" fill="#2f81f7"/><circle cx="31.4" cy="38.6" r="1.7" fill="#2f81f7"/>
    <text x="60" y="34" font-size="20" font-weight="700" fill="#0f172a">ASHS — Agentic Self-Healing System</text>
    <text x="60" y="54" font-size="13" fill="#64748b">Detects a product failure, attributes it to the owning repository from objective evidence, repairs it there, and proves the fix.</text>
  </g>

  <!-- ============================================ APPLICATION PLANE -->
  <rect x="24" y="86" width="770" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="42" y="110" font-size="11" font-weight="700" letter-spacing="1.4" fill="#64748b">APPLICATION PLANE — ordinary workloads, one Compose project per owner</text>

  <!-- cfc-product -->
  <rect x="42" y="124" width="228" height="192" rx="8" fill="#fff" stroke="#2f81f7" stroke-dasharray="5 3"/>
  <text x="54" y="144" font-size="11" font-weight="700" fill="#2f81f7">cfc-product · Product Engineering</text>
  <text x="54" y="159" font-size="10" fill="#94a3b8">autonomy L3 — may merge and deploy</text>

  <rect x="56" y="170" width="90" height="46" rx="6" fill="#eff6ff" stroke="#2f81f7"/>
  <text x="101" y="190" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">cfc-web</text>
  <text x="101" y="205" font-size="9.5" text-anchor="middle" fill="#64748b">React</text>

  <rect x="164" y="170" width="92" height="46" rx="6" fill="#eff6ff" stroke="#2f81f7"/>
  <text x="210" y="190" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">cfc-api</text>
  <text x="210" y="205" font-size="9.5" text-anchor="middle" fill="#64748b">BFF</text>

  <text x="56" y="252" font-size="9.5" fill="#64748b">entry point</text>
  <text x="56" y="266" font-size="9.5" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">POST /api/footprint/calculate</text>
  <rect x="56" y="276" width="200" height="30" rx="5" fill="#fef2f2" stroke="#f87171"/>
  <text x="66" y="295" font-size="9.5" fill="#b91c1c">ACT 1 — mishandles a valid reply</text>

  <!-- cap-calc -->
  <rect x="286" y="124" width="200" height="192" rx="8" fill="#fff" stroke="#0891b2" stroke-dasharray="5 3"/>
  <text x="298" y="144" font-size="11" font-weight="700" fill="#0891b2">cap-calc · Calculation</text>
  <text x="298" y="159" font-size="10" fill="#94a3b8">autonomy L1 — diagnose only</text>

  <rect x="300" y="170" width="170" height="46" rx="6" fill="#ecfeff" stroke="#0891b2"/>
  <text x="385" y="190" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">calc-api</text>
  <text x="385" y="205" font-size="9.5" text-anchor="middle" fill="#64748b">POST /v1/calculate</text>

  <rect x="300" y="252" width="170" height="54" rx="5" fill="#f0fdf4" stroke="#3fb950"/>
  <text x="385" y="272" font-size="10" text-anchor="middle" fill="#15803d">publishes /openapi.json</text>
  <text x="385" y="288" font-size="10" text-anchor="middle" fill="#15803d">generated from code</text>

  <!-- cap-factors -->
  <rect x="502" y="124" width="278" height="192" rx="8" fill="#fff" stroke="#7c3aed" stroke-dasharray="5 3"/>
  <text x="514" y="144" font-size="11" font-weight="700" fill="#7c3aed">cap-factors · Emission Factors</text>
  <text x="514" y="159" font-size="10" fill="#94a3b8">autonomy L3 — Scenario 2 owner</text>

  <rect x="516" y="170" width="120" height="46" rx="6" fill="#faf5ff" stroke="#7c3aed"/>
  <text x="576" y="190" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">factor-api</text>
  <text x="576" y="205" font-size="9" text-anchor="middle" fill="#64748b">/v1/factors/bulk</text>

  <rect x="654" y="170" width="112" height="46" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="710" y="190" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">factor-db</text>
  <text x="710" y="205" font-size="9" text-anchor="middle" fill="#64748b">internal net only</text>

  <rect x="516" y="276" width="250" height="30" rx="5" fill="#fef2f2" stroke="#f87171"/>
  <text x="526" y="295" font-size="9.5" fill="#b91c1c">ACT 2 — HTTP 200 breaking its own schema</text>

  <!-- request flow -->
  <line x1="146" y1="193" x2="162" y2="193" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="256" y1="193" x2="298" y2="193" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="470" y1="193" x2="514" y2="193" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="636" y1="193" x2="652" y2="193" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M210 216 V232 H576 V220" fill="none" stroke="#94a3b8" stroke-width="1.2"
        stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="393" y="245" font-size="9" fill="#94a3b8" text-anchor="middle">cfc-api also calls factor-api directly</text>

  <!-- ============================================ ATTRIBUTION PANEL -->
  <rect x="816" y="86" width="400" height="330" rx="10" fill="#f0fdf4" stroke="#3fb950"/>
  <text x="834" y="110" font-size="11" font-weight="700" letter-spacing="1.4" fill="#15803d">ATTRIBUTION — 100% DETERMINISTIC, NO MODEL</text>

  <text x="834" y="134" font-size="11.5" fill="#0f172a">Five signals, combined into a confidence score:</text>

  <g font-size="10.5">
    <text x="834" y="158" font-weight="700" fill="#0f172a">trace walk</text>
    <text x="1196" y="158" text-anchor="end" font-family="ui-monospace, Menlo, monospace" fill="#15803d">0.40</text>
    <text x="846" y="172" font-size="9.5" fill="#64748b">deepest error span carrying an exception</text>

    <text x="834" y="196" font-weight="700" fill="#0f172a">contract validation</text>
    <text x="960" y="196" font-size="9" fill="#15803d">THE DECISIVE TEST</text>
    <text x="1196" y="196" text-anchor="end" font-family="ui-monospace, Menlo, monospace" fill="#15803d">0.88</text>
    <text x="846" y="210" font-size="9.5" fill="#64748b">the payload it returned vs the schema it published</text>
    <text x="846" y="223" font-size="9.5" fill="#64748b">invalid → the capability · valid → the consumer</text>

    <text x="834" y="247" font-weight="700" fill="#0f172a">deploy correlation</text>
    <text x="1196" y="247" text-anchor="end" font-family="ui-monospace, Menlo, monospace" fill="#15803d">0.25</text>
    <text x="846" y="261" font-size="9.5" fill="#64748b">what shipped before first occurrence</text>

    <text x="834" y="285" font-weight="700" fill="#0f172a">blast radius</text>
    <text x="1196" y="285" text-anchor="end" font-family="ui-monospace, Menlo, monospace" fill="#15803d">0.22</text>
    <text x="846" y="299" font-size="9.5" fill="#64748b">one consumer, or every consumer? chain → root</text>

    <text x="834" y="323" font-weight="700" fill="#94a3b8">exoneration</text>
    <text x="1196" y="323" text-anchor="end" font-family="ui-monospace, Menlo, monospace" fill="#94a3b8">0.15</text>
    <text x="846" y="337" font-size="9.5" fill="#64748b">ruling a capability out is positive evidence too</text>
  </g>

  <line x1="834" y1="352" x2="1196" y2="352" stroke="#bbf7d0"/>
  <g font-size="10">
    <rect x="834" y="362" width="112" height="42" rx="5" fill="#dcfce7" stroke="#3fb950"/>
    <text x="890" y="379" text-anchor="middle" font-weight="700" fill="#15803d">≥ 0.85</text>
    <text x="890" y="394" text-anchor="middle" font-size="9" fill="#15803d">act at the service's level</text>

    <rect x="958" y="362" width="112" height="42" rx="5" fill="#fef3c7" stroke="#d97706"/>
    <text x="1014" y="379" text-anchor="middle" font-weight="700" fill="#b45309">0.60 – 0.85</text>
    <text x="1014" y="394" text-anchor="middle" font-size="9" fill="#b45309">draft, human approves</text>

    <rect x="1082" y="362" width="114" height="42" rx="5" fill="#fee2e2" stroke="#f87171"/>
    <text x="1139" y="379" text-anchor="middle" font-weight="700" fill="#b91c1c">&lt; 0.60</text>
    <text x="1139" y="394" text-anchor="middle" font-size="9" fill="#b91c1c">escalate, do not guess</text>
  </g>

  <!-- ============================================ TELEMETRY -->
  <rect x="24" y="432" width="770" height="86" rx="10" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="42" y="456" font-size="11" font-weight="700" letter-spacing="1.4" fill="#7c3aed">TELEMETRY — every span carries code.repository</text>
  <rect x="42" y="466" width="176" height="38" rx="6" fill="#fff" stroke="#a855f7"/>
  <text x="130" y="490" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">otel-collector</text>
  <text x="236" y="482" font-size="10.5" fill="#475569">spans · logs · deployments · raw downstream response bodies</text>
  <text x="236" y="498" font-size="10.5" fill="#475569">code.repository is the join key that maps a failing span to an owner</text>

  <line x1="150" y1="320" x2="150" y2="430" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrowTel)"/>
  <line x1="385" y1="320" x2="385" y2="430" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrowTel)"/>
  <line x1="600" y1="320" x2="600" y2="430" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrowTel)"/>

  <!-- write-back path, routed through clear space on the right -->
  <path d="M886 534 V524 H802 V300 H786" fill="none" stroke="#3fb950" stroke-width="1.8"
        stroke-dasharray="6 4" marker-end="url(#arrowAct)"/>
  <text x="812" y="452" font-size="9.5" font-weight="600" fill="#15803d" transform="rotate(-90 812 452)">scoped write · hot reload</text>

  <!-- ============================================ CONTROL PLANE -->
  <rect x="24" y="534" width="1192" height="206" rx="10" fill="#f0f9ff" stroke="#2f81f7"/>
  <text x="42" y="558" font-size="11" font-weight="700" letter-spacing="1.4" fill="#2f81f7">CONTROL PLANE — ashs-control · a reconciler, not a one-shot pipeline</text>

  <g font-size="10.5" text-anchor="middle">
    <rect x="42" y="572" width="96" height="52" rx="6" fill="#fff" stroke="#2f81f7"/>
    <text x="90" y="592" font-weight="700" fill="#0f172a">detect</text>
    <text x="90" y="607" font-size="9" fill="#64748b">3 errors / 5 min</text>
    <text x="90" y="618" font-size="9" fill="#64748b">fingerprint + dedupe</text>

    <rect x="150" y="572" width="96" height="52" rx="6" fill="#fff" stroke="#2f81f7"/>
    <text x="198" y="592" font-weight="700" fill="#0f172a">evidence</text>
    <text x="198" y="607" font-size="9" fill="#64748b">bounded to one</text>
    <text x="198" y="618" font-size="9" fill="#64748b">exemplar trace</text>

    <rect x="258" y="572" width="128" height="52" rx="6" fill="#ecfdf5" stroke="#3fb950" stroke-width="2"/>
    <text x="322" y="592" font-weight="700" fill="#15803d">attribute</text>
    <text x="322" y="607" font-size="9" fill="#15803d">5 signals · NO model</text>
    <text x="322" y="618" font-size="9" fill="#15803d">fault domain + confidence</text>

    <rect x="398" y="572" width="96" height="52" rx="6" fill="#faf5ff" stroke="#a855f7"/>
    <text x="446" y="592" font-weight="700" fill="#6b21a8">diagnose</text>
    <text x="446" y="607" font-size="9" fill="#7c3aed">model call 1</text>
    <text x="446" y="618" font-size="9" fill="#7c3aed">narrative only</text>

    <rect x="506" y="572" width="88" height="52" rx="6" fill="#fff" stroke="#2f81f7"/>
    <text x="550" y="592" font-weight="700" fill="#0f172a">route</text>
    <text x="550" y="607" font-size="9" fill="#64748b">repo → agent</text>
    <text x="550" y="618" font-size="9" fill="#64748b">hard boundary</text>

    <rect x="606" y="572" width="96" height="52" rx="6" fill="#faf5ff" stroke="#a855f7"/>
    <text x="654" y="592" font-weight="700" fill="#6b21a8">plan + patch</text>
    <text x="654" y="607" font-size="9" fill="#7c3aed">model call 2</text>
    <text x="654" y="618" font-size="9" fill="#7c3aed">code + its test</text>

    <rect x="714" y="572" width="104" height="52" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="766" y="592" font-weight="700" fill="#b45309">policy</text>
    <text x="766" y="607" font-size="9" fill="#b45309">9 gates, in code</text>
    <text x="766" y="618" font-size="9" fill="#b45309">any fail → human</text>

    <rect x="830" y="572" width="112" height="52" rx="6" fill="#ecfdf5" stroke="#3fb950" stroke-width="2.5"/>
    <text x="886" y="590" font-weight="700" fill="#15803d">TEST GATE</text>
    <text x="886" y="605" font-size="9" fill="#15803d">must FAIL pre-patch</text>
    <text x="886" y="616" font-size="9" fill="#15803d">must PASS post-patch</text>

    <rect x="954" y="572" width="100" height="52" rx="6" fill="#fff" stroke="#2f81f7"/>
    <text x="1004" y="592" font-weight="700" fill="#0f172a">validate</text>
    <text x="1004" y="607" font-size="9" fill="#64748b">replay the request</text>
    <text x="1004" y="618" font-size="9" fill="#64748b">error rate → baseline</text>

    <rect x="1066" y="572" width="132" height="52" rx="6" fill="#f0fdf4" stroke="#3fb950"/>
    <text x="1132" y="590" font-weight="700" fill="#15803d">RESOLVED</text>
    <text x="1132" y="605" font-size="9" fill="#b91c1c">or ROLLBACK → ESCALATED</text>
    <text x="1132" y="617" font-size="9" fill="#64748b">restored byte-for-byte</text>
  </g>

  <g stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrow)">
    <line x1="138" y1="598" x2="148" y2="598"/><line x1="246" y1="598" x2="256" y2="598"/>
    <line x1="386" y1="598" x2="396" y2="598"/><line x1="494" y1="598" x2="504" y2="598"/>
    <line x1="594" y1="598" x2="604" y2="598"/><line x1="702" y1="598" x2="712" y2="598"/>
    <line x1="818" y1="598" x2="828" y2="598"/><line x1="942" y1="598" x2="952" y2="598"/>
    <line x1="1054" y1="598" x2="1064" y2="598"/>
  </g>

  <!-- config + stores -->
  <rect x="42" y="640" width="252" height="84" rx="7" fill="#fff" stroke="#94a3b8"/>
  <text x="54" y="659" font-size="10.5" font-weight="700" fill="#0f172a">Configuration — mounted read-only</text>
  <text x="54" y="677" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#2f81f7">services.yaml</text>
  <text x="146" y="677" font-size="9" fill="#64748b">owners, deps, contracts, autonomy</text>
  <text x="54" y="693" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#d97706">policy.yaml</text>
  <text x="146" y="693" font-size="9" fill="#64748b">gates, floors, protected zones</text>
  <text x="54" y="712" font-size="9" fill="#94a3b8">A rule change is an edit and a restart, not a rebuild.</text>

  <rect x="310" y="640" width="238" height="84" rx="7" fill="#fff" stroke="#94a3b8"/>
  <text x="322" y="659" font-size="10.5" font-weight="700" fill="#0f172a">Tool gateway — 11 typed tools</text>
  <text x="322" y="678" font-size="9.5" fill="#64748b">Path allowlist per agent. No raw shell,</text>
  <text x="322" y="693" font-size="9.5" fill="#64748b">no kubectl, no eval. Every call audited —</text>
  <text x="322" y="708" font-size="9.5" fill="#64748b">including the ones it refuses.</text>

  <rect x="564" y="640" width="238" height="84" rx="7" fill="#fff" stroke="#94a3b8"/>
  <text x="576" y="659" font-size="10.5" font-weight="700" fill="#0f172a">ashs-db — the audit trail</text>
  <text x="576" y="678" font-size="9.5" fill="#64748b">Append-only, sequenced, never rewritten.</text>
  <text x="576" y="693" font-size="9.5" fill="#64748b">Every transition with the evidence that</text>
  <text x="576" y="708" font-size="9.5" fill="#64748b">justified it — replayable by incident ID.</text>

  <rect x="818" y="640" width="380" height="84" rx="7" fill="#fff" stroke="#94a3b8"/>
  <text x="830" y="659" font-size="10.5" font-weight="700" fill="#0f172a">ashs-ui :3001 — the operations console</text>
  <text x="830" y="678" font-size="9.5" fill="#64748b">Incidents · phase-grouped decision feed · evidence and artifacts</text>
  <text x="830" y="693" font-size="9.5" fill="#64748b">The diff, the test-gate result, the exonerations, the escalation queue.</text>
  <text x="830" y="708" font-size="9.5" fill="#64748b">Nothing on screen that is not backed by a row in the audit trail.</text>

  <line x1="410" y1="518" x2="410" y2="566" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrowTel)"/>
</svg>
